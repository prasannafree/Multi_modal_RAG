[project]
name = "multi-modal-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.24.0",
    "pillow>=10.0.0",
    "python-docx>=1.1.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "parser",
    "chunker",
    "embeddings",
    "vector_store",
    "similarity_metrics",
    "reranker",
    "context_preparation",
    "generator",
    "main",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
